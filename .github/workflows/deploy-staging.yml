name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: staging
    env:
      APP_DIR: /home/ubuntu/apps/dota-core-be-staging
      BRANCH: dev
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: APP_DIR,BRANCH
          script: |
            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
            npm ci
            npm run build
            npm run migration:run:v2
            pm2 restart core-backend-staging
            pm2 restart core-backend-v2-staging
