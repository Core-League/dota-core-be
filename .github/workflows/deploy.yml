name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /home/ubuntu/apps/dota-core-be
      BRANCH: main
      NODE_ENV: production
      DB_HOST: 127.0.0.1
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: APP_DIR,BRANCH,NODE_ENV,DB_HOST
          script: |
            cd "$APP_DIR"
            git fetch origin
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            npm ci --include=dev
            npm run build
            npm run migration:run
            npm run migration:run:v2
            pm2 startOrRestart ecosystem.config.js --only core-backend --update-env
            pm2 startOrRestart ecosystem.config.js --only core-backend-v2 --update-env
