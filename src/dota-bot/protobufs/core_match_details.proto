syntax = "proto2";

// Hand-written subset of Valve's dota_gcmessages_client.proto /
// dota_gcmessages_common.proto (same commit as VERSION.txt): only the fields
// the host bot reads from `k_EMsgGCMatchDetailsResponse` (7096). Field numbers
// match Valve's; unknown fields are skipped by protobufjs, so the full
// message decodes fine. Vendoring the real files would drag in webapi, econ
// and networkbasetypes protos for no gain.

message CMsgGCMatchDetailsRequest {
	optional uint64 match_id = 1;
}

message CoreDotaMatch {
	message Player {
		optional uint32 account_id = 1;
		optional uint32 player_slot = 2;
		optional int32 hero_id = 3;
		optional uint32 kills = 14;
		optional uint32 deaths = 15;
		optional uint32 assists = 16;
		optional uint32 leaver_status = 17;
		optional uint32 gold = 18;
		optional uint32 last_hits = 19;
		optional uint32 denies = 20;
		optional uint32 level = 27;
		optional uint32 net_worth = 52;
		optional uint32 team_number = 80;
	}

	optional uint32 duration = 3;
	optional fixed32 starttime = 4;
	repeated Player players = 5;
	optional uint64 match_id = 6;
	optional uint32 lobby_type = 16;
	optional uint32 game_mode = 31;
	optional uint32 match_outcome = 50;
}

message CMsgGCMatchDetailsResponse {
	optional uint32 result = 1;
	optional CoreDotaMatch match = 2;
}
